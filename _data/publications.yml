publications:
  - title: A Multimodal hyperspectral dataset of cocoa beans with physicochemical annotation
    authors:
      - Kebin Contreras
      - Mohamad Jouni
      - Mauro Dalla Mura
      - Jorge Bacca
    type: *journal
    venue: *scidata
    year: 2025
    thumbnail: /media/images/20251127_cocoaspec_pub/41597_2025_6314_Fig12_HTML.webp
    thumbnail_alt: Cocoa bean scenes acquired with four cameras and annotated by fermentation quality
    summary: >-
      A multimodal cocoa-bean dataset combines spectral images from four cameras
      with physicochemical measurements to support non-invasive quality assessment.
    links:
      - link: https://www.nature.com/articles/s41597-025-06314-9
        icon: *ic-link
        type: Paper (Sci. Data)
      - link: https://hal.science/hal-05476083
        icon: *ic-pdf
        type: Paper (HAL)
      - link: https://huggingface.co/datasets/ecos-nord-ginp-uis/CoCoaSpec
        icon: *ic-hf
        type: Dataset
      - link: https://github.com/kebincontreras/CoCoaSpec
        icon: *ic-github
        type: Code
      - link: /news/20251127-paper-cocoaspec/
        icon: *ic-link
        type: News
    id: "ContrerasJDB25:scidata"

  - title: Leveraging pretrained RGB denoisers for hyperspectral image restoration
    authors:
      - Daniele Picone
      - Mohamad Jouni
      - Mauro Dalla Mura
    type: *conference
    venue: *icip
    year: 2026
    thumbnail: /media/images/20260430_icip_pub/architecture.webp
    thumbnail_alt: Encoder and decoder adapters surrounding a pretrained RGB denoiser
    summary: >-
      Lightweight adapters reuse frozen pretrained RGB denoisers for hyperspectral
      restoration through spectral projections and learned reconstruction.
    links:
      - link: https://ieeexplore.ieee.org/abstract/document/11630149
        icon: *ic-link
        type: Paper (IEEE Xplore)
      - link: https://arxiv.org/abs/2605.24769
        icon: *ic-pdf
        type: Paper (arXiv)
      - link: https://hal.science/hal-05631436
        icon: *ic-pdf
        type: Paper (HAL)
      - link: /news/20260430-paper-adapters/
        icon: *ic-link
        type: News
    id: "PiconeJD26:icip"

  - title: Lightweight Interpretable RGB-Guided Hyperspectral Super-Resolution under Real Cross-resolution Misalignment
    authors:
      - Mohamad Jouni
      - Aurélien Godet
      - Mauro Dalla Mura
    type: *conference
    venue: *bmvc
    year: 2026
    thumbnail: /media/images/20260811_bmvc_pub/overview.webp
    thumbnail_alt: Cross-modal registration and confidence-aware RGB-guided hyperspectral fusion
    summary: >-
      Cross-modal alignment and confidence-aware fusion improve RGB-guided
      hyperspectral super-resolution under real camera misalignment with a low
      computational footprint.
