# Content for /reading-group/. See README.md for the format and examples.
# Description, session abstracts, and speaker biographies support Markdown.
description: |
  The **PICSA Reading Group** is a series of research talks and paper discussions
  organized within the **PICSA group at GIPSA-lab**. It brings together researchers,
  students, and visiting colleagues to share recent advances in computational
  imaging, inverse problems, spectral imaging, multimodal fusion, and machine
  learning, exchange ideas, and explore new collaborations.

  Everyone interested is welcome to attend. **MIRA hosts this page** for the group.

